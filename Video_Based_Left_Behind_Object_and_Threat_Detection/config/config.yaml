# School Security System Configuration

system:
  name: "Video-Based Left Behind Object and Threat Detection System"
  version: "1.0.0"
  timezone: "Asia/Kolkata"  # Adjust to your timezone

# School Schedule Configuration
schedule:
  # Define class periods (24-hour format)
  periods:
    - name: "Period 1"
      start: "08:00"
      end: "08:45"
    - name: "Period 2"
      start: "08:50"
      end: "09:35"
    - name: "Period 3"
      start: "09:40"
      end: "10:25"
    - name: "Break"
      start: "10:25"
      end: "10:45"
    - name: "Period 4"
      start: "10:45"
      end: "11:30"
    - name: "Period 5"
      start: "11:35"
      end: "12:20"
    - name: "Lunch"
      start: "12:20"
      end: "13:00"
    - name: "Period 6"
      start: "13:00"
      end: "13:45"
    - name: "Period 7"
      start: "13:50"
      end: "14:35"
    - name: "Period 8"
      start: "14:40"
      end: "15:25"
  
  # School days
  school_days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
  
  # Holidays (YYYY-MM-DD format)
  holidays:
    - "2024-01-26"  # Republic Day
    - "2024-08-15"  # Independence Day
    - "2024-10-02"  # Gandhi Jayanti

# Camera Configuration
cameras:
  - id: "CAM_001"
    name: "Classroom 1A"
    location: "Building A, Floor 1, Room 1A"
    type: "ESP32-CAM"
    ip: "192.168.1.101"
    enabled: true
    detection_zones:
      - type: "classroom"
        coordinates: [[0, 0], [640, 0], [640, 480], [0, 480]]
  
  - id: "CAM_002"
    name: "Classroom 1B"
    location: "Building A, Floor 1, Room 1B"
    type: "ESP32-CAM"
    ip: "192.168.1.102"
    enabled: true
    detection_zones:
      - type: "classroom"
        coordinates: [[0, 0], [640, 0], [640, 480], [0, 480]]

# Object Detection Configuration
object_detection:
  model:
    type: "yolov8"
    # Custom-trained model with school-specific classes (Pen, Backpack/Tas-Ransel,
    # Laptop, Water-bottle, Umbrella, Sports equipment etc.)
    weights: "models/object_detection_training/weights/best.pt"
    # Secondary COCO model for items not in custom model (book, cell phone, keyboard…)
    secondary_weights: "yolov8s.pt"
    input_size: [640, 640]
    confidence_threshold: 0.30        # Balanced: catches phones/bottles without face FPs
    secondary_confidence_threshold: 0.30  # Same bar for COCO model
    iou_threshold: 0.45

  # Classes to detect — includes BOTH custom-model names AND COCO names.
  # Custom model class names (from best.pt / data.yaml):
  #   Tas-Ransel, Gateway, Laptop, Pen, Baseball-bat, Water-bottle,
  #   Tennis-racket, Basketball, Soccer-ball, Water-Bottle, water-bottle, umbrella
  target_classes:
    # ── Custom model classes (best.pt) ─────────────────────────────────────
    - "Tas-Ransel"     # Backpack / School bag (Indonesian label in dataset)
    - "Gateway"        # Laptop/device (Gateway brand in dataset)
    - "Laptop"         # Laptop
    - "Pen"            # Pen / Pencil  ← FIXED: custom model CAN detect this
    - "Baseball-bat"   # Baseball bat
    - "Water-bottle"   # Water bottle
    - "Tennis-racket"  # Tennis racket
    - "Basketball"     # Basketball
    - "Soccer-ball"    # Soccer ball
    - "Water-Bottle"   # Water bottle (alternate casing in dataset)
    - "water-bottle"   # Water bottle (alternate casing in dataset)
    - "umbrella"       # Umbrella (lowercase in custom model)
    # ── COCO model classes (yolov8n.pt) ────────────────────────────────────
    - "person"         # Person detection (NEVER marked as left-behind)
    - "backpack"       # Backpack (COCO label)
    - "handbag"        # Handbag
    - "suitcase"       # Suitcase
    - "book"           # Books / Notebooks  ← detected by COCO model
    - "bottle"         # Water bottles (COCO)
    - "cup"            # Cups, mugs
    - "cell phone"     # Mobile phones  ← detected by COCO model
    - "laptop"         # Laptop (COCO lowercase)
    - "keyboard"       # Keyboard
    - "mouse"          # Computer mouse
    - "remote"         # TV remote
    - "scissors"       # Scissors
    - "clock"          # Clock / Watch
    # toothbrush removed — too many false positives on faces/noses
    - "teddy bear"     # Soft toys
    - "Umbrella"       # Umbrella (capitalized, matches COCO alias)

  # Time threshold for left-behind detection (minutes after last class)
  left_behind_threshold: 60

  # Minimum object size (pixels²) — kept low for small items like pens
  min_object_size: 400  # Phone at 2-3m = ~20x50px = 1000px²; 400 gives comfortable margin

# Threat Detection Configuration
threat_detection:
  model:
    type: "pose"                    # YOLOv8n-pose + optical flow heuristics
    weights: null                   # no custom weights needed — uses yolov8n-pose.pt
    input_size: [640, 640]
    clip_length: 8                  # smoothing history window (frames) — shorter = faster response
    confidence_threshold: 0.55     # raised from 0.40 to reduce false positives on normal movement

  # Threat categories detected by the pose-based system
  threat_classes:
    - "fighting"
    - "pushing"
    - "aggressive_behavior"
    - "fall_detected"

  # Alert immediately on threat detection
  immediate_alert: true

# Tracking Configuration
tracking:
  algorithm: "deepsort"  # or "sort", "bytetrack"
  max_age: 2  # Remove box after 2 missed frames — nearly instant removal
  min_hits: 1  # Show box on very first detection — no appearance delay
  iou_threshold: 0.3

# Notification Configuration
notifications:
  left_behind_objects:
    channels: ["email", "telegram"]
    recipients:
      email: ["security@school.com"]
      telegram: ["SECURITY_CHAT_ID"]
    cooldown_minutes: 15  # Avoid spam
  
  threats:
    channels: ["email", "telegram", "sms"]
    recipients:
      email: ["principal@school.com", "security@school.com"]
      telegram: ["PRINCIPAL_CHAT_ID", "SECURITY_CHAT_ID"]
      sms: ["+1234567890"]
    cooldown_minutes: 5

# Storage Configuration
storage:
  alerts_retention_days: 90
  video_clips_retention_days: 30
  snapshots_path: "data/snapshots"
  videos_path: "data/videos"
  logs_path: "logs"

# Performance Configuration
performance:
  frame_skip: 2  # Process every Nth frame
  batch_size: 1
  use_gpu: true
  gpu_id: 0
  num_workers: 4

